name: CI

# 薄调用层：门禁规则本体在 oagentkit/.github/.github/workflows/go-ci.yml。
# 改门禁规则只改那一个仓，这里不用动。

on:
  push:
    branches: [main]
    # tag 事件也要跑：共享 workflow 是 workflow_call（加不了触发器），
    # 触发器只能加在各仓薄调用层——与矩阵其余 13 个模块仓同款。
    # 打 tag 时会多跑一档 matrix-registration：打 tag 的仓必须在矩阵登记面内。
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint & Test
    uses: oagentkit/.github/.github/workflows/go-ci.yml@main
    with:
      go-version: '1.26'
